name: vidya-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidya_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidya_password}
      POSTGRES_DB: ${POSTGRES_DB:-vidya_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidya} -d ${POSTGRES_DB:-vidya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: vidya_prod_valkey
    restart: always
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata_prod:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidya_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidya}:${POSTGRES_PASSWORD:-vidya_password}@postgres:5432/${POSTGRES_DB:-vidya_db}?schema=public
      VALKEY_URL: redis://valkey:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-vidya_production_super_secret_jwt_access_key_2026_min_32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-vidya_production_super_secret_jwt_refresh_key_2026_min_32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidya_prod_frontend
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata_prod:
    name: vidya_prod_pgdata
  valkeydata_prod:
    name: vidya_prod_valkeydata
