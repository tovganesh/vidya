name: ${COMPOSE_PROJECT_NAME:-vidya}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-vidya}_postgres
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidya_password}
      POSTGRES_DB: ${POSTGRES_DB:-vidya_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidya} -d ${POSTGRES_DB:-vidya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ${CONTAINER_PREFIX:-vidya}_valkey
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-vidya}_backend
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-vidya}:${POSTGRES_PASSWORD:-vidya_password}@postgres:5432/${POSTGRES_DB:-vidya_db}?schema=public
      VALKEY_URL: redis://valkey:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-vidya_production_super_secret_jwt_access_key_2026_min_32}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-vidya_production_super_secret_jwt_refresh_key_2026_min_32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      SCHOOL_NAME: ${SCHOOL_NAME:-}
      SCHOOL_CODE: ${SCHOOL_CODE:-}
      SCHOOL_DESCRIPTION: ${SCHOOL_DESCRIPTION:-}
      SCHOOL_BOARD: ${SCHOOL_BOARD:-CBSE}
      SCHOOL_AFFILIATION_NO: ${SCHOOL_AFFILIATION_NO:-}
      SCHOOL_EMAIL: ${SCHOOL_EMAIL:-}
      SCHOOL_PHONE: ${SCHOOL_PHONE:-}
      SCHOOL_CITY: ${SCHOOL_CITY:-}
      SCHOOL_STATE: ${SCHOOL_STATE:-}
      SCHOOL_THEME_COLOR: ${SCHOOL_THEME_COLOR:-indigo}
      SCHOOL_THEME_MODE: ${SCHOOL_THEME_MODE:-dark}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    profiles:
      - prod
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-vidya}_frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - prod
      - full

volumes:
  pgdata:
    name: ${PGDATA_VOLUME:-vidya_pgdata}
  valkeydata:
    name: ${VALKEYDATA_VOLUME:-vidya_valkeydata}
