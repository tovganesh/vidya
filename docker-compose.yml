name: vidya

services:
  postgres:
    image: postgres:16-alpine
    container_name: vidya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidya_password}
      POSTGRES_DB: ${POSTGRES_DB:-vidya_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidya} -d ${POSTGRES_DB:-vidya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: vidya_valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: vidya_pgdata
  valkeydata:
    name: vidya_valkeydata
